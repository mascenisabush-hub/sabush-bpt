<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sabush</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B1F3A" />
    <!-- [PWA installability — Android Chrome + iPhone Safari]
         mobile-web-app-capable is the modern, non-vendor-prefixed
         standard (Chrome/Android); apple-mobile-web-app-capable is
         still required for iOS Safari specifically, which does not
         yet honor the standard tag alone. iOS never fires Chrome's
         own beforeinstallprompt/install-banner event — "Add to Home
         Screen" there is only ever available through Safari's own
         Share menu — but once a user does that, these tags are what
         make the resulting home-screen icon launch as a real,
         standalone app (status bar matching the brand color, no
         Safari chrome) instead of just a bookmark shortcut that opens
         an ordinary browser tab. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sabush" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter: the disciplined UI/data workhorse — labels, tables, buttons.
         Fraunces: the one deliberate flourish — business name + hero
         numbers only, so the app reads as designed rather than templated. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,500..600&family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
